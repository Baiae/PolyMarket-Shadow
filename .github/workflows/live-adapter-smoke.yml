name: Live Adapter Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'agent/scripts/live_adapter_smoke.py'
      - 'agent/scripts/live_forecast_snapshot_smoke.py'
      - 'agent/scripts/live_resolution_snapshot_smoke.py'
      - 'agent/scripts/live_evidence_template_smoke.py'
      - 'agent/src/forecasting/collection.py'
      - 'agent/src/forecasting/resolution.py'
      - 'agent/src/forecasting/evidence_templates.py'
      - 'agent/tests/test_forecast_resolution_capture.py'
      - 'agent/tests/test_evidence_templates.py'
      - '.github/workflows/live-adapter-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'agent/scripts/live_adapter_smoke.py'
      - 'agent/scripts/live_forecast_snapshot_smoke.py'
      - 'agent/scripts/live_resolution_snapshot_smoke.py'
      - 'agent/scripts/live_evidence_template_smoke.py'
      - 'agent/src/forecasting/collection.py'
      - 'agent/src/forecasting/resolution.py'
      - 'agent/src/forecasting/evidence_templates.py'
      - 'agent/tests/test_forecast_resolution_capture.py'
      - 'agent/tests/test_evidence_templates.py'
      - '.github/workflows/live-adapter-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp websockets pydantic-settings openai

      - name: Run read-only live Gamma + WebSocket smoke
        working-directory: agent
        run: |
          python scripts/live_adapter_smoke.py \
            --seconds 25 \
            --market-count 3 \
            --output ../live-adapter-smoke/websocket-evidence.json

      - name: Run read-only live CLOB forecast-baseline smoke
        working-directory: agent
        run: |
          python scripts/live_forecast_snapshot_smoke.py \
            --market-count 3 \
            --output ../live-adapter-smoke/forecast-baseline-evidence.json

      - name: Run read-only live CLOB resolution-state smoke
        working-directory: agent
        run: |
          python scripts/live_resolution_snapshot_smoke.py \
            --market-count 3 \
            --output ../live-adapter-smoke/resolution-evidence.json

      - name: Run read-only live market-specific evidence smoke
        working-directory: agent
        run: |
          python scripts/live_evidence_template_smoke.py \
            --output ../live-adapter-smoke/dynamic-evidence.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-adapter-smoke-evidence
          path: live-adapter-smoke/
          if-no-files-found: error
          retention-days: 14
